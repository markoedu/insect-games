<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>鳴蟲物語 - 互動遊戲</title>
<style>
  :root {
    --bg: #fdf6e3;
    --card: #ffffff;
    --accent: #4a7c59;
    --accent-dark: #2e5339;
    --text: #333;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    background: linear-gradient(180deg, #fdf6e3 0%, #eef3e0 100%);
    color: var(--text);
    min-height: 100vh;
    padding: 24px 16px 60px;
  }
  header {
    text-align: center;
    margin-bottom: 32px;
  }
  header h1 {
    font-size: 2rem;
    color: var(--accent-dark);
    margin-bottom: 8px;
  }
  header p {
    color: #666;
    font-size: 1rem;
  }
  .grid {
    max-width: 900px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 20px;
  }
  .card {
    background: var(--card);
    border-radius: 16px;
    padding: 24px 20px;
    text-align: center;
    text-decoration: none;
    color: var(--text);
    box-shadow: 0 4px 10px rgba(0,0,0,0.08);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }
  .card:hover {
    transform: translateY(-4px);
    box-shadow: 0 8px 16px rgba(0,0,0,0.12);
  }
  .card .emoji {
    font-size: 2.5rem;
  }
  .card h2 {
    font-size: 1.1rem;
    margin: 0;
    color: var(--accent-dark);
  }
  .card p {
    font-size: 0.9rem;
    color: #777;
    margin: 0;
  }
  .card.soon {
    opacity: 0.6;
    pointer-events: none;
    position: relative;
  }
  .card.soon .badge {
    position: absolute;
    top: 10px;
    right: 10px;
    background: #e8b84b;
    color: #fff;
    font-size: 0.7rem;
    padding: 2px 8px;
    border-radius: 999px;
  }
  footer {
    text-align: center;
    margin-top: 40px;
    color: #999;
    font-size: 0.85rem;
  }
</style>
</head>
<body>

<header>
  <h1>🎶 鳴蟲物語</h1>
  <p>點一張卡片,開始體驗鳴叫昆蟲的聲音科學！</p>
</header>

<div class="grid">

  <a class="card" href="game1/index.html">
    <div class="emoji">🦗</div>
    <h2>灌蟋蟀</h2>
    <p>把躲藏的蟋蟀引出來,看你能不能成功！</p>
  </a>

  <a class="card" href="game2/index.html">
    <div class="emoji">⚔️</div>
    <h2>鬥蟋蟀</h2>
    <p>跟著節奏比聲音,鬥蛐蛐大賽開始！</p>
  </a>

  <a class="card" href="game3/index.html">
    <div class="emoji">💨</div>
    <h2>蟋蟀求偶</h2>
    <p>手速對決,看誰先追到心儀對象！</p>
  </a>

  <a class="card" href="game4/index.html">
    <div class="emoji">🌡️</div>
    <h2>鈴蟲氣溫計</h2>
    <p>調整溫度,聽聽鈴蟲叫聲怎麼變化。</p>
  </a>

  <a class="card" href="game5/index.html">
    <div class="emoji">🕳️</div>
    <h2>聽聲辨位找螻蛄</h2>
    <p>靠近聲音變大聲,限時挖出躲藏的螻蛄！</p>
  </a>

  <a class="card soon" href="#">
    <span class="badge">即將推出</span>
    <div class="emoji">🎵</div>
    <h2>熊蟬的聲音</h2>
    <p>(連結準備好後,把這張卡片的 href 換成連結網址)</p>
  </a>

  <a class="card soon" href="#">
    <span class="badge">即將推出</span>
    <div class="emoji">🎐</div>
    <h2>童玩・竹蟬的聲音</h2>
    <p>(連結準備好後,把這張卡片的 href 換成連結網址)</p>
  </a>

</div>

<footer>彰安 × 平和 兩校合作 · 廣達游於藝鳴蟲展</footer>

</body>
</html>
