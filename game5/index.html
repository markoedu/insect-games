<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>地底聲納：螻蛄獵人</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
    :root {
        --bg-page-1: #FFF6E0;
        --bg-page-2: #FCE4A8;
        --panel-bg: #FFF3DD;
        --panel-border: #C8965A;
        --text-main: #4A2E1D;
        --text-muted: #8A6A48;
        --accent-sun: #F2A007;
        --accent-green: #6FA83B;
        --accent-green-dark: #4E7A28;
        --accent-red: #E4573D;
        --card-bg: #FFFBF2;
        --card-border: #E8C088;
    }
    @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
            --bg-page-1: #2B2118;
            --bg-page-2: #3A2C1E;
            --panel-bg: #3D2E20;
            --panel-border: #6B4E33;
            --text-main: #F5E9D6;
            --text-muted: #D8C3A5;
            --card-bg: #3A2C1E;
            --card-border: #6B4E33;
        }
    }
    :root[data-theme="dark"] {
        --bg-page-1: #2B2118;
        --bg-page-2: #3A2C1E;
        --panel-bg: #3D2E20;
        --panel-border: #6B4E33;
        --text-main: #F5E9D6;
        --text-muted: #D8C3A5;
        --card-bg: #3A2C1E;
        --card-border: #6B4E33;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { -webkit-user-select: none; user-select: none; }
    body {
        font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif;
        background: linear-gradient(180deg, var(--bg-page-1), var(--bg-page-2));
        color: var(--text-main);
        margin: 0;
        padding: 24px 12px;
        display: flex;
        flex-direction: column;
        align-items: center;
        min-height: 100vh;
    }

    #game-interface {
        position: relative;
        width: min(800px, 94vw);
        margin-bottom: 12px;
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        flex-wrap: wrap;
        gap: 10px;
    }

    #volume-panel, #score-panel {
        background: var(--panel-bg);
        border: 2px solid var(--panel-border);
        border-radius: 14px;
        padding: 10px 16px;
    }

    #volume-panel { display: flex; flex-direction: column; align-items: flex-start; }
    .volume-title {
        font-size: 13px;
        font-weight: 700;
        color: var(--text-muted);
        margin-bottom: 8px;
        display: flex;
        align-items: center;
        gap: 6px;
    }
    .volume-bar-container { display: flex; gap: 4px; align-items: center; }
    .volume-cell {
        width: 14px;
        height: 22px;
        background-color: rgba(0,0,0,0.12);
        border: 1px solid var(--panel-border);
        border-radius: 3px;
        transition: background-color 0.05s ease, box-shadow 0.05s ease;
    }
    .volume-cell.active.level-low { background-color: #6FA83B; box-shadow: 0 0 7px #6FA83B; }
    .volume-cell.active.level-med { background-color: #F2A007; box-shadow: 0 0 7px #F2A007; }
    .volume-cell.active.level-high { background-color: #E4573D; box-shadow: 0 0 9px #E4573D; }

    #score-panel { text-align: right; }
    .stat-line {
        font-family: 'Baloo 2', 'Noto Sans TC', sans-serif;
        font-size: 20px;
        font-weight: 700;
        margin: 3px 0;
        white-space: nowrap;
    }
    .stat-label { color: var(--text-muted); font-size: 13px; margin-right: 8px; font-family: 'Noto Sans TC', sans-serif; font-weight: 500; }

    #canvas-container {
        position: relative;
        width: min(800px, 94vw);
        box-shadow: 0 14px 30px rgba(74,46,29,0.35);
        border-radius: 18px;
        overflow: hidden;
        border: 5px solid #7a5230;
    }

    canvas {
        background-color: #9c6b3e;
        display: block;
        width: 100%;
        height: auto;
        cursor: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='32' height='32' viewBox='0 0 32 32'><path d='M22,2 L30,10 L22,18 L18,14 L20,12 L14,6 L16,4 Z' fill='%23b2bec3' stroke='%232d3436' stroke-width='1.5'/><path d='M14,18 L4,28 L2,30 L0,28 L2,26 L12,16 Z' fill='%23d63031' stroke='%232d3436' stroke-width='1.5'/><circle cx='15' cy='15' r='1.5' fill='%232d3436'/></svg>") 2 30, auto;
        touch-action: none;
    }

    #overlay-screen {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(74, 46, 29, 0.82);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
        z-index: 10;
        transition: opacity 0.3s ease;
        overflow-y: auto;
    }
    #overlay-screen.hidden { opacity: 0; pointer-events: none; }

    .overlay-card {
        background: var(--card-bg);
        border: 3px solid var(--card-border);
        border-radius: 20px;
        padding: 28px 26px;
        max-width: 600px;
        width: 100%;
        text-align: center;
        color: var(--text-main);
    }
    .hidden-content { display: none; }

    h1.card-title {
        font-family: 'Baloo 2', 'Noto Sans TC', sans-serif;
        font-size: 26px;
        line-height: 1.4;
        color: var(--accent-sun);
        margin: 0 0 18px 0;
    }

    .rule-row {
        display: flex;
        align-items: center;
        gap: 12px;
        text-align: left;
        background: rgba(0,0,0,0.05);
        border-radius: 12px;
        padding: 10px 14px;
        margin-bottom: 10px;
        font-size: 16px;
        line-height: 1.5;
    }
    .rule-row .emoji { font-size: 26px; flex-shrink: 0; }
    .rule-row b { color: var(--accent-green-dark); }
    .rule-row.danger b { color: var(--accent-red); }

    .btn {
        background-color: var(--accent-green);
        color: white;
        border: none;
        padding: 13px 34px;
        font-size: 18px;
        font-weight: 700;
        font-family: 'Noto Sans TC', sans-serif;
        border-radius: 25px;
        cursor: pointer;
        box-shadow: 0 5px 14px rgba(111,168,59,0.45);
        transition: transform 0.1s, background-color 0.2s;
        margin-top: 8px;
    }
    .btn:hover { background-color: var(--accent-green-dark); transform: translateY(-2px); }
    .btn:active { transform: translateY(1px); }

    .final-score {
        font-family: 'Baloo 2', 'Noto Sans TC', sans-serif;
        font-size: 34px;
        line-height: 1.4;
        color: var(--accent-sun);
        margin: 4px 0 18px 0;
    }

    .science-card {
        display: flex;
        align-items: center;
        gap: 14px;
        flex-wrap: wrap;
        background: rgba(0,0,0,0.05);
        border-radius: 14px;
        padding: 14px;
        text-align: left;
        margin-bottom: 18px;
    }
    .science-card img { width: 210px; max-width: 100%; height: auto; border-radius: 10px; flex-shrink: 0; display: block; }
    .science-card .science-text { flex: 1; min-width: 220px; }
    .science-card .science-label {
        font-weight: 700;
        color: var(--accent-green-dark);
        font-size: 17px;
        margin-bottom: 6px;
        display: flex;
        align-items: center;
        gap: 5px;
    }
    .science-card p { margin: 0; font-size: 17px; line-height: 1.75; color: var(--text-main); }

    .floating-text {
        position: absolute;
        color: #F2A007;
        font-weight: 700;
        font-size: 22px;
        pointer-events: none;
        animation: floatUp 0.8s ease-out forwards;
        text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    }
    @keyframes floatUp {
        0% { transform: translateY(0) scale(0.8); opacity: 0; }
        20% { opacity: 1; }
        100% { transform: translateY(-60px) scale(1.2); opacity: 0; }
    }
</style>
</head>

                            <p>螻蛄的前足特化成鏟狀，擅長快速鑽土逃逸；牠靠摩擦前翅發出鳴叫求偶，一旦察覺威脅接近就會立刻噤聲躲藏。農民與科學家常利用這樣的習性偵測、誘捕螻蛄，進行防治或生態調查——你剛剛體驗的，正是真實的科學方法！</p>
                        </div>
                    </div>

                    <button class="btn" onclick="handleActionClick()">再巡一次</button>
                </div>

            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('fieldCanvas');
        const ctx = canvas.getContext('2d');
        const volumeCells = document.querySelectorAll('.volume-cell');
        const scoreText = document.getElementById('scoreText');
        const timerText = document.getElementById('timerText');
        const overlayScreen = document.getElementById('overlay-screen');
        const startContent = document.getElementById('start-content');
        const endContent = document.getElementById('end-content');
        const finalScoreText = document.getElementById('finalScoreText');
        const canvasContainer = document.getElementById('canvas-container');

        let gameActive = false;
        let score = 0;
        let timeLeft = 30;
        let gameLoopId = null;
        let countdownId = null;

        let cricket = { x: 0, y: 0, radius: 22 };
        let mouse = { x: -1000, y: -1000 };

        let soilParticles = [];
        let caughtCrickets = [];

        function initSoil() {
            soilParticles = [];
            for (let i = 0; i < 70; i++) {
                soilParticles.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    size: Math.random() * 3 + 1,
                    color: Math.random() > 0.5 ? '#7a5230' : '#b3835a'
                });
            }
        }

        let audioCtx = null;
        let playTimeout = null;

        function playCricketChirp() {
            if (!gameActive) return;

            let dx = mouse.x - cricket.x;
            let dy = mouse.y - cricket.y;
            let dist = Math.sqrt(dx*dx + dy*dy);
            let maxDist = 550;

            let volRatio = Math.max(0, 1 - (dist / maxDist));
            volRatio = Math.pow(volRatio, 1.5);

            if (dist <= cricket.radius) {
                volRatio = 0;
            }

            updateVolumeBar(volRatio, dist <= cricket.radius);

            let nextChirpDelay = 200 + (1 - volRatio) * 400;

            if (volRatio > 0) {
                let now = audioCtx.currentTime;
                for (let i = 0; i < 3; i++) {
                    let startTime = now + (i * 0.04);
                    let duration = 0.025;

                    let carrier = audioCtx.createOscillator();
                    let modulator = audioCtx.createOscillator();
                    let modGain = audioCtx.createGain();
                    let gainNode = audioCtx.createGain();

                    carrier.type = 'sine';
                    carrier.frequency.value = 4200;

                    modulator.type = 'sawtooth';
                    modulator.frequency.value = 120;
                    modGain.gain.value = 800;

                    gainNode.gain.setValueAtTime(0, startTime);
                    gainNode.gain.linearRampToValueAtTime(volRatio * 0.15, startTime + 0.005);
                    gainNode.gain.exponentialRampToValueAtTime(0.001, startTime + duration);

                    modulator.connect(modGain);
                    modGain.connect(carrier.frequency);
                    carrier.connect(gainNode);
                    gainNode.connect(audioCtx.destination);

                    modulator.start(startTime);
                    carrier.start(startTime);
                    modulator.stop(startTime + duration);
                    carrier.stop(startTime + duration);
                }
            }

            playTimeout = setTimeout(playCricketChirp, nextChirpDelay);
        }

        function spawnCricket() {
            cricket.x = Math.floor(Math.random() * (canvas.width - 160)) + 80;
            cricket.y = Math.floor(Math.random() * (canvas.height - 120)) + 60;
        }

        function handleActionClick() {
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            resetAndStartGame();
        }

        function resetAndStartGame() {
            score = 0;
            timeLeft = 30;
            gameActive = true;
            scoreText.innerText = "0000";
            timerText.innerText = "30s";
            caughtCrickets = [];

            overlayScreen.classList.add('hidden');
            initSoil();
            spawnCricket();

            if (countdownId) clearInterval(countdownId);
            countdownId = setInterval(() => {
                timeLeft--;
                timerText.innerText = `${timeLeft}s`;
                if (timeLeft <= 0) {
                    endGame();
                }
            }, 1000);

            if (playTimeout) clearTimeout(playTimeout);
            playCricketChirp();

            if (gameLoopId) cancelAnimationFrame(gameLoopId);
            updateVisuals();
        }

        function endGame() {
            gameActive = false;
            clearInterval(countdownId);
            clearTimeout(playTimeout);
            cancelAnimationFrame(gameLoopId);

            updateVolumeBar(0, false);

            finalScoreText.innerText = score;
            startContent.classList.add('hidden-content');
            endContent.classList.remove('hidden-content');
            overlayScreen.classList.remove('hidden');
        }

        function updateMouseFromClient(clientX, clientY) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            mouse.x = (clientX - rect.left) * scaleX;
            mouse.y = (clientY - rect.top) * scaleY;
        }

        function handleDig() {
            if (!gameActive) return;

            let dx = mouse.x - cricket.x;
            let dy = mouse.y - cricket.y;
            let dist = Math.sqrt(dx*dx + dy*dy);

            if (dist <= cricket.radius) {
                score += 100;
                scoreText.innerText = String(score).padStart(4, '0');

                createFloatingText("+100 抓到了!", mouse.x, mouse.y);
                triggerCricketPopUp(cricket.x, cricket.y);

                playCatchSound();
                spawnCricket();
            } else {
                score = Math.max(0, score - 10);
                scoreText.innerText = String(score).padStart(4, '0');
                createFloatingText("空包彈!", mouse.x, mouse.y);
                playMissSound();
            }
        }

        canvas.addEventListener('mousemove', (e) => {
            if (!gameActive) return;
            updateMouseFromClient(e.clientX, e.clientY);
        });

        canvas.addEventListener('mousedown', (e) => {
            if (!gameActive) return;
            updateMouseFromClient(e.clientX, e.clientY);
            handleDig();
        });

        canvas.addEventListener('touchmove', (e) => {
            if (!gameActive) return;
            e.preventDefault();
            const t = e.touches[0];
            updateMouseFromClient(t.clientX, t.clientY);
        }, { passive: false });

        canvas.addEventListener('touchstart', (e) => {
            if (!gameActive) return;
            e.preventDefault();
            const t = e.touches[0];
            updateMouseFromClient(t.clientX, t.clientY);
            handleDig();
        }, { passive: false });

        function triggerCricketPopUp(x, y) {
            caughtCrickets.push({
                x: x,
                y: y,
                startY: y,
                jumpHeight: 0,
                velocity: -8,
                gravity: 0.4,
                scale: 1,
                alpha: 1,
                life: 45
            });
        }

        function drawMoleCricketIcon(ctx, x, y, scale, alpha) {
            ctx.save();
            ctx.globalAlpha = alpha;
            ctx.translate(x, y);
            ctx.scale(scale, scale);

            ctx.fillStyle = '#b37d4e';
            ctx.beginPath();
            ctx.ellipse(0, 10, 10, 16, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.strokeStyle = '#5c3d21';
            ctx.lineWidth = 1.5;
            for(let i = 0; i < 3; i++) {
                ctx.beginPath();
                ctx.arc(0, 4 + i*5, 8, 0, Math.PI);
                ctx.stroke();
            }

            ctx.fillStyle = '#8c5830';
            ctx.beginPath();
            ctx.ellipse(0, -6, 12, 10, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#5c3d21';
            ctx.beginPath();
            ctx.arc(0, -18, 6, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#000000';
            ctx.beginPath(); ctx.arc(-3, -19, 1.5, 0, Math.PI*2); ctx.arc(3, -19, 1.5, 0, Math.PI*2); ctx.fill();
            ctx.strokeStyle = '#5c3d21';
            ctx.lineWidth = 1;
            ctx.beginPath(); ctx.moveTo(-2, -23); ctx.quadraticCurveTo(-8, -32, -12, -30); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(2, -23); ctx.quadraticCurveTo(8, -32, 12, -30); ctx.stroke();

            ctx.fillStyle = '#d99b62';
            ctx.strokeStyle = '#5c3d21';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.moveTo(-8, -8);
            ctx.quadraticCurveTo(-22, -10, -20, 0);
            ctx.lineTo(-12, -2);
            ctx.fill(); ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(-21, -5); ctx.lineTo(-24, -2); ctx.lineTo(-20, 0); ctx.lineTo(-22, 3); ctx.lineTo(-16, 2);
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(8, -8);
            ctx.quadraticCurveTo(22, -10, 20, 0);
            ctx.lineTo(12, -2);
            ctx.fill(); ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(21, -5); ctx.lineTo(24, -2); ctx.lineTo(20, 0); ctx.lineTo(22, 3); ctx.lineTo(16, 2);
            ctx.stroke();

            ctx.restore();
        }

        function playCatchSound() {
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.frequency.setValueAtTime(500, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(1500, audioCtx.currentTime + 0.25);
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
            osc.start(); osc.stop(audioCtx.currentTime + 0.25);
        }

        function playMissSound() {
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(140, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
            osc.start(); osc.stop(audioCtx.currentTime + 0.15);
        }

        function createFloatingText(text, x, y) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = rect.width / canvas.width;
            const scaleY = rect.height / canvas.height;
            const el = document.createElement('div');
            el.className = 'floating-text';
            el.innerText = text;
            el.style.left = `${x * scaleX}px`;
            el.style.top = `${(y * scaleY) + 60}px`;
            canvasContainer.appendChild(el);
            setTimeout(() => el.remove(), 800);
        }

        function updateVolumeBar(ratio, isSilentZone) {
            let activeCellsCount = Math.ceil(ratio * 10);
            if (isSilentZone) activeCellsCount = 0;

            volumeCells.forEach((cell, index) => {
                if (index < activeCellsCount) {
                    cell.classList.add('active');
                } else {
                    cell.classList.remove('active');
                }
            });
        }

        function updateVisuals() {
            if (!gameActive) return;

            ctx.fillStyle = '#9c6b3e';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            soilParticles.forEach(p => {
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
                ctx.fill();
            });

            for (let i = caughtCrickets.length - 1; i >= 0; i--) {
                let c = caughtCrickets[i];
                c.velocity += c.gravity;
                c.y += c.velocity;
                c.life--;

                if (c.life < 20) {
                    c.alpha = c.life / 20;
                    c.scale = 0.6 + (c.life / 20) * 0.4;
                }

                drawMoleCricketIcon(ctx, c.x, c.y, c.scale, c.alpha);

                if (c.life <= 0) {
                    caughtCrickets.splice(i, 1);
                }
            }

            gameLoopId = requestAnimationFrame(updateVisuals);
        }
    </script>
</body>
</html>
