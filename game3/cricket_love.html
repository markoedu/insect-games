<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鳴蟲求偶大作戰</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root, :root:not([data-theme="light"]) {
    --sky-top: #bfe4f3;
    --sky-mid: #fbe3c0;
    --grass: #cfe8ba;
    --ground: #f7efdc;
    --ink: #3d4a3f;
    --ink-soft: #7c887e;
    --p1: #5b9fca;
    --p1-soft: #d8ecf7;
    --p2: #e79a35;
    --p2-soft: #fbe7c3;
    --good: #6fb582;
    --warn: #e2935f;
    --card-bg: #fffaf0;
    --radius-lg: 22px;
    --radius-md: 14px;
    --radius-sm: 9px;
    --shadow-soft: 0 6px 18px rgba(61, 74, 63, 0.14);
    --font-num: "Baloo 2", "Microsoft JhengHei", sans-serif;
    --font-body: "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", sans-serif;
  }
  :root[data-theme="dark"] {
    --sky-top: #bfe4f3;
    --sky-mid: #fbe3c0;
    --grass: #cfe8ba;
    --ground: #f7efdc;
    --ink: #3d4a3f;
    --ink-soft: #7c887e;
    --p1: #5b9fca;
    --p1-soft: #d8ecf7;
    --p2: #e79a35;
    --p2-soft: #fbe7c3;
    --good: #6fb582;
    --warn: #e2935f;
    --card-bg: #fffaf0;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 16px;
    background: #eef6ee;
    font-family: var(--font-body);
    color: var(--ink);
    display: flex;
    justify-content: center;
    align-items: flex-start;
    min-height: 100vh;
    user-select: none;
    -webkit-user-select: none;
  }

  #game-container {
    width: min(760px, 96vw);
    aspect-ratio: 4 / 3;
    display: flex;
    flex-direction: column;
    background: linear-gradient(180deg, var(--sky-top) 0%, var(--sky-top) 30%, var(--sky-mid) 58%, var(--grass) 59%, var(--grass) 100%);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-soft);
    overflow: hidden;
    position: relative;
  }

  /* 資訊列 */
  .info-bar {
    flex: 0 0 auto;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px clamp(14px, 3vw, 26px);
    background: rgba(255, 255, 255, 0.55);
  }
  .score-block { display: flex; flex-direction: column; align-items: center; min-width: 64px; }
  .score-label { font-size: clamp(12px, 2vw, 14px); font-weight: 600; }
  .score-label.p1 { color: var(--p1); }
  .score-label.p2 { color: var(--p2); }
  .score-value { font-family: var(--font-num); font-size: clamp(20px, 4.5vw, 28px); font-weight: 700; line-height: 1; }
  .timer-block { display: flex; flex-direction: column; align-items: center; }
  .timer-value { font-family: var(--font-num); font-size: clamp(22px, 5vw, 30px); font-weight: 700; color: var(--ink); }
  .timer-caption { font-size: clamp(10px, 1.8vw, 12px); color: var(--ink-soft); }

  /* 舞台 */
  .stage {
    flex: 1 1 38%;
    position: relative;
    border-bottom: 3px dashed rgba(255, 255, 255, 0.7);
  }

  .cricket {
    width: clamp(44px, 10vw, 70px);
    height: clamp(44px, 10vw, 70px);
    position: absolute;
    bottom: 6%;
    font-size: clamp(30px, 7vw, 48px);
    text-align: center;
    line-height: 1;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    transition: left 0.25s ease;
  }
  #cricket-p1 { left: 8%; transform: scaleX(-1); }
  #cricket-p2 { right: 8%; }
  #female-cricket {
    left: 46%;
    bottom: 14%;
    font-size: clamp(32px, 7.5vw, 50px);
    filter: drop-shadow(0 0 8px rgba(255, 182, 217, 0.8));
  }

  .wing-shake { animation: shakeL 0.12s ease-in-out 2; }
  .wing-shake-p2 { animation: shakeR 0.12s ease-in-out 2; }
  @keyframes shakeL {
    0%, 100% { transform: translate(0, 0) rotate(0deg) scaleX(-1); }
    50% { transform: translate(-2px, -2px) rotate(-4deg) scaleX(-1); }
  }
  @keyframes shakeR {
    0%, 100% { transform: translate(0, 0) rotate(0deg); }
    50% { transform: translate(2px, -2px) rotate(4deg); }
  }
  @media (prefers-reduced-motion: reduce) {
    .wing-shake, .wing-shake-p2 { animation: none; }
  }

  /* 節奏軌道區 */
  .rhythm-area {
    flex: 1 1 42%;
    background: var(--ground);
    display: flex;
    flex-direction: column;
  }
  .track {
    flex: 1 1 50%;
    position: relative;
    display: flex;
    align-items: center;
    border-top: 1px solid rgba(61, 74, 63, 0.08);
  }
  .track:first-child { border-top: none; }

  .hit-zone {
    width: clamp(38px, 8vw, 54px);
    height: clamp(38px, 8vw, 54px);
    border-radius: 50%;
    border: 3px solid;
    position: absolute;
    left: 12%;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-family: var(--font-num);
    font-size: clamp(15px, 3vw, 19px);
    background: rgba(255, 255, 255, 0.6);
  }
  .track-p1 .hit-zone { border-color: var(--p1); color: var(--p1); }
  .track-p2 .hit-zone { border-color: var(--p2); color: var(--p2); }

  .note {
    width: clamp(26px, 5.5vw, 38px);
    height: clamp(26px, 5.5vw, 38px);
    border-radius: 50%;
    position: absolute;
    transform: translateX(-50%);
  }
  .note-p1 { background: var(--p1); box-shadow: 0 2px 6px rgba(91, 159, 202, 0.5); }
  .note-p2 { background: var(--p2); box-shadow: 0 2px 6px rgba(231, 154, 53, 0.5); }

  .feedback {
    position: absolute;
    left: 12%;
    top: -6px;
    font-size: clamp(13px, 2.6vw, 16px);
    font-weight: 700;
    opacity: 0;
    pointer-events: none;
  }
  .feedback.show { animation: fadeUp 0.5s ease-out; }
  @keyframes fadeUp {
    0% { opacity: 1; transform: translateY(0); }
    100% { opacity: 0; transform: translateY(-22px); }
  }

  /* 觸控按鈕 */
  .touch-btn-container {
    flex: 0 0 auto;
    display: flex;
    justify-content: space-between;
    gap: 12px;
    padding: 10px clamp(14px, 3vw, 26px) 14px;
  }
  .touch-btn {
    flex: 1;
    padding: 12px 0;
    border-radius: var(--radius-md);
    border: none;
    color: white;
    font-family: var(--font-body);
    font-size: clamp(14px, 3vw, 17px);
    font-weight: 700;
    cursor: pointer;
    transition: transform 0.06s;
  }
  .touch-btn:active { transform: scale(0.94); }
  .touch-btn:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
  #btn-touch-p1 { background: var(--p1); }
  #btn-touch-p2 { background: var(--p2); }

  /* 覆蓋層 */
  .overlay {
    position: absolute;
    inset: 0;
    background: rgba(255, 250, 240, 0.97);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: clamp(20px, 5vw, 40px);
    z-index: 10;
  }
  .overlay h2 {
    margin: 0 0 10px;
    font-size: clamp(20px, 4.5vw, 26px);
    color: var(--ink);
  }
  .overlay p {
    margin: 4px 0;
    font-size: clamp(14px, 3vw, 16px);
    color: var(--ink);
    max-width: 520px;
    line-height: 1.6;
  }
  .hint {
    color: var(--ink-soft);
    font-size: clamp(12px, 2.6vw, 14px) !important;
  }
  .warn-line {
    color: var(--warn) !important;
    font-weight: 700;
  }

  .btn {
    background: var(--good);
    color: white;
    border: none;
    padding: 13px 36px;
    font-size: clamp(16px, 3.5vw, 19px);
    font-family: var(--font-body);
    font-weight: 700;
    border-radius: 999px;
    cursor: pointer;
    margin-top: 18px;
    box-shadow: var(--shadow-soft);
  }
  .btn:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }

  .fact-box {
    background: var(--card-bg);
    border-left: 5px solid var(--p2);
    padding: 12px 16px;
    margin: 16px 0 0;
    border-radius: var(--radius-sm);
    max-width: 520px;
    text-align: left;
    font-size: clamp(13px, 2.8vw, 15px);
    line-height: 1.6;
  }

  .hidden { display: none !important; }
</style>
</head>
<body>

<div id="game-container" data-theme="light">
  <div class="info-bar">
    <div class="score-block">
      <span class="score-label p1">藍方</span>
      <span class="score-value" id="p1-score-txt">0</span>
    </div>
    <div class="timer-block">
      <span class="timer-value" id="timer-value">30</span>
      <span class="timer-caption">秒</span>
    </div>
    <div class="score-block">
      <span class="score-label p2">黃方</span>
      <span class="score-value" id="p2-score-txt">0</span>
    </div>
  </div>

  <div class="stage">
    <div id="cricket-p1" class="cricket">🦗</div>
    <div id="female-cricket" class="cricket">🦗</div>
    <div id="cricket-p2" class="cricket">🦗</div>
  </div>

  <div class="rhythm-area">
    <div class="track track-p1">
      <div class="hit-zone">A</div>
      <div id="fb-p1" class="feedback"></div>
    </div>
    <div class="track track-p2">
      <div class="hit-zone">L</div>
      <div id="fb-p2" class="feedback"></div>
    </div>
  </div>

  <div class="touch-btn-container">
    <button id="btn-touch-p1" class="touch-btn">拍翅膀 A</button>
    <button id="btn-touch-p2" class="touch-btn">拍翅膀 L</button>
  </div>

  <div id="start-screen" class="overlay">
    <h2>誰是鳴蟲情歌王？</h2>
    <p>公蟋蟀摩擦翅膀求偶，音符滾到圈圈時準時拍一下，節奏越準，母蟋蟀就會越靠近你！</p>
    <p class="warn-line">太早拍或亂拍會扣分喔！</p>
    <p class="hint">電腦：按 A／L 鍵　｜　平板：點下方按鈕</p>
    <button class="btn" onclick="startGame()">開始對決</button>
  </div>

  <div id="end-screen" class="overlay hidden">
    <h2 id="winner-title">遊戲結束</h2>
    <p id="winner-desc"></p>
    <div class="fact-box">
      蟋蟀的耳朵長在前腳上！母蟋蟀靠聽覺挑選節奏最穩、聲音最響亮的對象，這是牠們求偶的溝通方式。
    </div>
    <button class="btn" onclick="resetGame()">再玩一次</button>
  </div>
</div>

<script>
  const timerValueTxt = document.getElementById('timer-value');
  const p1ScoreTxt = document.getElementById('p1-score-txt');
  const p2ScoreTxt = document.getElementById('p2-score-txt');
  const femaleCricket = document.getElementById('female-cricket');
  const p1Cricket = document.getElementById('cricket-p1');
  const p2Cricket = document.getElementById('cricket-p2');
  const startScreen = document.getElementById('start-screen');
  const endScreen = document.getElementById('end-screen');
  const btnTouchP1 = document.getElementById('btn-touch-p1');
  const btnTouchP2 = document.getElementById('btn-touch-p2');
  const trackP1 = document.querySelector('.track-p1');
  const trackP2 = document.querySelector('.track-p2');

  // ---- 遊戲參數（以軌道百分比為單位，畫面大小無關）----
  const GAME_DURATION_MS = 30000;
  const HIT_ZONE_PCT = 12;      // 判定圈在軌道 12% 處
  const TRAVEL_TIME_SEC = 2.8;  // 音符從最右邊滑到判定圈要花的時間
  const SPEED_PCT_PER_SEC = (100 - HIT_ZONE_PCT) / TRAVEL_TIME_SEC;
  const PERFECT_PCT = 3.5;
  const GOOD_PCT = 7;

  let p1Score = 0, p2Score = 0;
  let timeLeft = 30;
  let isPlaying = false;
  let timerInterval = null;
  let gameStartTime = 0;
  let lastFrameTime = 0;
  let schedule = [];
  let scheduleIndex = 0;
  let activeNotesP1 = [];
  let activeNotesP2 = [];
  let femaleLeftPct = 50;

  // ---- 音效 ----
  let audioCtx = null;
  function initAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  // 一次點擊 = 一次翅膀摩擦（一個音節）。玩家連續點擊一組音符時，
  // 這些短促音會自然連成一串「鳴叫聲」，比較貼近真實蟋蟀的求偶聲。
  function playCricketPulse(isPerfect) {
    if (!audioCtx) return;
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    const freq = isPerfect ? 4600 : 3800;
    osc.type = 'sine';
    osc.frequency.setValueAtTime(freq, now);
    osc.frequency.exponentialRampToValueAtTime(freq * 0.85, now + 0.045);
    gain.gain.setValueAtTime(0, now);
    gain.gain.linearRampToValueAtTime(isPerfect ? 0.32 : 0.2, now + 0.006);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(now);
    osc.stop(now + 0.06);
  }

  // ---- 產生節奏序列（模擬真實蟋蟀：音節密集成串，串與串之間有停頓）----
  // 兩位玩家共用同一份序列，確保表現一樣好時分數一定相同。
  function generateSchedule(durationMs) {
    const times = [];
    let t = 1200;
    while (t < durationMs - 1500) {
      const syllables = 2 + Math.floor(Math.random() * 3); // 一串 2~4 個音節
      const syllableGap = 170 + Math.random() * 50;         // 串內間隔較密集
      for (let s = 0; s < syllables; s++) {
        times.push(Math.round(t));
        t += syllableGap;
      }
      t += 700 + Math.random() * 700; // 串與串之間的停頓
    }
    return times;
  }

  function playerAction(player) {
    if (!isPlaying) return;
    checkHit(player === 'p1' ? activeNotesP1 : activeNotesP2, player);
  }

  window.addEventListener('keydown', (e) => {
    if (e.repeat) return;
    if (e.key === 'a' || e.key === 'A') { initAudio(); playerAction('p1'); }
    if (e.key === 'l' || e.key === 'L') { initAudio(); playerAction('p2'); }
  });

  function bindTouchButton(element, player) {
    const handle = (e) => { e.preventDefault(); initAudio(); playerAction(player); };
    element.addEventListener('touchstart', handle, { passive: false });
    element.addEventListener('mousedown', handle);
  }
  bindTouchButton(btnTouchP1, 'p1');
  bindTouchButton(btnTouchP2, 'p2');

  function startGame() {
    initAudio();
    startScreen.classList.add('hidden');
    endScreen.classList.add('hidden');
    isPlaying = true;
    p1Score = 0; p2Score = 0;
    timeLeft = 30;
    activeNotesP1 = []; activeNotesP2 = [];
    femaleLeftPct = 50;
    scheduleIndex = 0;
    schedule = generateSchedule(GAME_DURATION_MS);

    p1ScoreTxt.innerText = p1Score;
    p2ScoreTxt.innerText = p2Score;
    timerValueTxt.innerText = timeLeft;
    femaleCricket.style.left = '46%';

    document.querySelectorAll('.note').forEach(n => n.remove());

    clearInterval(timerInterval);
    timerInterval = setInterval(() => {
      timeLeft--;
      timerValueTxt.innerText = Math.max(timeLeft, 0);
      if (timeLeft <= 0) endGame();
    }, 1000);

    gameStartTime = performance.now();
    lastFrameTime = gameStartTime;
    requestAnimationFrame(updateGame);
  }

  function spawnNote(player) {
    const track = player === 'p1' ? trackP1 : trackP2;
    const note = document.createElement('div');
    note.classList.add('note', `note-${player}`);
    note.style.left = '100%';
    track.appendChild(note);
    const noteObj = { element: note, x: 100 };
    (player === 'p1' ? activeNotesP1 : activeNotesP2).push(noteObj);
  }

  function moveNotes(arr, player, dtMs) {
    const step = SPEED_PCT_PER_SEC * (dtMs / 1000);
    for (let i = arr.length - 1; i >= 0; i--) {
      const n = arr[i];
      n.x -= step;
      n.element.style.left = n.x + '%';
      if (n.x < HIT_ZONE_PCT - GOOD_PCT - 2) {
        n.element.remove();
        arr.splice(i, 1);
        showFeedback(player, '太慢了', 'var(--ink-soft)');
      }
    }
  }

  function updateGame(now) {
    if (!isPlaying) return;
    const dt = now - lastFrameTime;
    lastFrameTime = now;
    const elapsed = now - gameStartTime;

    while (scheduleIndex < schedule.length && schedule[scheduleIndex] <= elapsed) {
      spawnNote('p1');
      spawnNote('p2');
      scheduleIndex++;
    }

    moveNotes(activeNotesP1, 'p1', dt);
    moveNotes(activeNotesP2, 'p2', dt);
    updateFemalePosition();

    requestAnimationFrame(updateGame);
  }

  function updateFemalePosition() {
    const scoreDiff = p2Score - p1Score;
    let newLeft = 50 + scoreDiff * 0.4;
    newLeft = Math.max(20, Math.min(80, newLeft));
    if (newLeft > femaleLeftPct) femaleCricket.style.transform = 'scaleX(-1)';
    else if (newLeft < femaleLeftPct) femaleCricket.style.transform = 'scaleX(1)';
    femaleLeftPct = newLeft;
    femaleCricket.style.left = newLeft + '%';
  }

  function checkHit(noteArray, player) {
    if (noteArray.length === 0) {
      addScore(player, -3);
      showFeedback(player, '亂拍 -3', 'var(--warn)');
      return;
    }
    const firstNote = noteArray[0];
    const distance = Math.abs(firstNote.x - HIT_ZONE_PCT);

    if (distance < PERFECT_PCT) {
      addScore(player, 5);
      showFeedback(player, 'Perfect', 'var(--good)');
      shakeWings(player);
      playCricketPulse(true);
      firstNote.element.remove();
      noteArray.shift();
    } else if (distance < GOOD_PCT) {
      addScore(player, 2);
      showFeedback(player, 'Good', 'var(--p2)');
      shakeWings(player);
      playCricketPulse(false);
      firstNote.element.remove();
      noteArray.shift();
    } else {
      addScore(player, -2);
      showFeedback(player, '太早了 -2', 'var(--warn)');
    }
  }

  function addScore(player, delta) {
    if (player === 'p1') p1Score = Math.max(0, p1Score + delta);
    else p2Score = Math.max(0, p2Score + delta);
    p1ScoreTxt.innerText = p1Score;
    p2ScoreTxt.innerText = p2Score;
  }

  function showFeedback(player, text, color) {
    const fb = document.getElementById(`fb-${player}`);
    fb.innerText = text;
    fb.style.color = color;
    fb.classList.remove('show');
    void fb.offsetWidth;
    fb.classList.add('show');
  }

  function shakeWings(player) {
    const el = player === 'p1' ? p1Cricket : p2Cricket;
    const cls = player === 'p1' ? 'wing-shake' : 'wing-shake-p2';
    el.classList.add(cls);
    setTimeout(() => el.classList.remove(cls), 160);
  }

  function endGame() {
    isPlaying = false;
    clearInterval(timerInterval);
    document.querySelectorAll('.note').forEach(n => n.remove());

    const title = document.getElementById('winner-title');
    const desc = document.getElementById('winner-desc');

    if (p1Score > p2Score) {
      title.innerText = '藍方公蟋蟀贏得青睞！';
      title.style.color = 'var(--p1)';
      desc.innerText = `藍方以 ${p1Score} 分打出最穩定的節奏，成功吸引了母蟋蟀！`;
    } else if (p2Score > p1Score) {
      title.innerText = '黃方公蟋蟀贏得青睞！';
      title.style.color = 'var(--p2)';
      desc.innerText = `黃方以 ${p2Score} 分打出最穩定的節奏，成功吸引了母蟋蟀！`;
    } else {
      title.innerText = '難分軒輊！';
      title.style.color = 'var(--ink)';
      desc.innerText = `兩隻公蟋蟀都是 ${p1Score} 分，母蟋蟀陷入了選擇困難。`;
    }
    endScreen.classList.remove('hidden');
  }

  function resetGame() {
    endScreen.classList.add('hidden');
    startScreen.classList.remove('hidden');
    timerValueTxt.innerText = 30;
  }
</script>
</body>
</html>
