<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>灌蟋蟀大冒險</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: "Microsoft JhengHei", sans-serif;
    background-color: #f4ebe1;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
    padding: 20px;
  }

  .screen {
    display: none;
    background: #fff8ec;
    border: 6px solid #8d5b4c;
    border-radius: 28px;
    padding: 30px;
    width: 100%;
    max-width: 1150px;
    box-shadow: 0 10px 20px rgba(0,0,0,0.2);
    flex-direction: column;
    align-items: center;
    text-align: center;
  }
  .screen.active { display: flex; }

  h2 { color: #5a3d28; margin: 0 0 16px 0; font-size: 36px; }
  p { color: #4a3728; font-size: 22px; line-height: 1.7; }

  .image-frame {
    width: 100%;
    max-width: 480px;
    aspect-ratio: 4 / 3;
    border: 4px solid #d4a15a;
    border-radius: 16px;
    background-color: #e6ccb2;
    background-size: cover;
    background-position: center;
    margin: 10px auto;
  }

  .two-col {
    display: flex;
    flex-direction: row;
    gap: 30px;
    align-items: center;
    width: 100%;
    text-align: left;
  }
  .two-col .image-frame { flex: 1; margin: 0; }
  .two-col .text-col { flex: 1; }

  @media (max-width: 800px) {
    .two-col { flex-direction: column; }
  }

  .image-frame.hole-image { aspect-ratio: 1408 / 768; max-width: 640px; }

  .btn {
    border: none;
    border-radius: 50px;
    padding: 18px 40px;
    font-size: 24px;
    font-weight: bold;
    color: #fff;
    cursor: pointer;
    user-select: none;
    margin-top: 10px;
  }
  .btn-main { background: #ff9800; box-shadow: 0 5px #e65100; }
  .btn-main:active { transform: translateY(5px); box-shadow: 0 0 #e65100; }
  .btn:disabled { background: #bdbdbd; box-shadow: 0 5px #9e9e9e; cursor: default; }

  .choice-row {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
    justify-content: center;
    margin-top: 16px;
    width: 100%;
  }
  .choice-btn {
    flex: 1;
    min-width: 120px;
    background: #6f9c3e;
    box-shadow: 0 5px #4c6f28;
  }
  .choice-btn:active { transform: translateY(5px); box-shadow: 0 0 #4c6f28; }

  /* ---- 頁面三 控水遊戲 ---- */
  .game-row {
    display: flex;
    flex-direction: row;
    gap: 30px;
    align-items: center;
    width: 100%;
  }
  .game-row .image-frame { flex: 1; margin: 0; }
  .game-panel { flex: 1.3; display: flex; flex-direction: column; align-items: center; }

  .game-area {
    display: flex;
    align-items: stretch;
    width: 100%;
    margin: 20px 0;
    border-radius: 16px;
    overflow: hidden;
  }
  .water-column {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    padding: 14px 0;
    background: #fdf0ed;
  }
  .hole-column {
    flex: 1;
    display: flex;
    flex-direction: column;
  }
  .ground-strip {
    width: 100%;
    height: 34px;
    background: #f4ebe1;
    flex-shrink: 0;
  }
  .soil-fill {
    flex: 1;
    width: 100%;
    background: #6b4423;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    padding: 0 0 14px 0;
  }
  .hole-svg { margin-top: -22px; }
  .bar-label { font-size: 22px; font-weight: bold; color: #424242; margin-top: 10px; }
  .hole-label { color: #fdf0ed; }

  .bottle-svg {
    width: 120px;
    height: 267px;
    display: block;
  }

  .hole-svg {
    width: 130px;
    height: 286px;
    display: block;
  }
  #status-msg { font-size: 24px; font-weight: bold; color: #d84315; height: 32px; margin-top: 8px; }

  @media (max-width: 800px) {
    .game-row { flex-direction: column; }
  }

  /* ---- 頁面四 懸疑過場 ---- */
  .suspense-text {
    font-size: 28px;
    font-weight: bold;
    color: #37474f;
    margin-top: 10px;
    animation: pulse 1s infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  /* ---- 頁面六 圖鑑卡 ---- */
  .card-inner {
    width: 100%;
    max-width: 420px;
  }
  .photo-frame {
    width: 100%;
    aspect-ratio: 4 / 3;
    border: 5px solid #d4a15a;
    border-radius: 16px;
    background-color: #e6ccb2;
    background-size: cover;
    background-position: center;
  }
  .species-name { font-size: 34px; font-weight: bold; color: #5a3d28; margin: 14px 0 0 0; }
  .nickname { font-size: 20px; color: #8d5b4c; margin: 4px 0 0 0; }
  .stat-row { display: flex; gap: 12px; width: 100%; margin-top: 16px; }
  .stat-box { flex: 1; background: #5a3d28; color: #fff; border-radius: 12px; padding: 10px 6px; text-align: center; }
  .stat-label { font-size: 15px; opacity: 0.85; letter-spacing: 2px; }
  .stat-value { font-size: 32px; font-weight: bold; margin-top: 4px; }
  .star-row { margin-top: 14px; font-size: 34px; letter-spacing: 4px; }
  .desc-box {
    width: 100%; background: #efe1cd; border-radius: 12px; margin-top: 16px;
    padding: 14px 16px; font-size: 19px; line-height: 1.7; color: #4a3728; text-align: left;
  }
  .btn-row { display: flex; gap: 12px; width: 100%; margin-top: 20px; }
  .btn-row .btn { flex: 1; margin-top: 0; font-size: 17px; padding: 14px 8px; white-space: nowrap; }
  .btn-sound { background: #4fc3f7; box-shadow: 0 4px #0288d1; }
  .btn-sound:active { transform: translateY(4px); box-shadow: 0 0 #0288d1; }
  .sound-credit {
    width: 100%;
    margin-top: 10px;
    font-size: 12px;
    color: #8d5b4c;
    opacity: 0.75;
    text-align: center;
  }

  .bgm-toggle {
    position: fixed;
    top: 14px;
    right: 14px;
    z-index: 100;
    width: 46px;
    height: 46px;
    border-radius: 50%;
    border: 3px solid #8d5b4c;
    background: #fff8ec;
    font-size: 20px;
    cursor: pointer;
    box-shadow: 0 3px #d4a15a;
  }
  .bgm-toggle:active { transform: translateY(3px); box-shadow: 0 0 #d4a15a; }
</style>
</head>
<body>

<!-- 背景音樂:輕鬆循環播放,右上角可隨時靜音 -->
<audio id="bgmAudio" loop preload="auto">
  <source src="bgm.mp3" type="audio/mpeg">
</audio>
<button id="bgmToggle" class="bgm-toggle">🔊</button>

<!-- 頁面一:尋洞測驗 -->
<div class="screen active" id="page1">
  <h2>尋找蟋蟀洞</h2>
  <div class="image-frame hole-image" style="background-image:url('pic01.jpeg')"></div>
  <p>田埂邊有三個洞口,仔細看看洞口的樣子,你覺得該灌哪一個?</p>
  <div class="choice-row">
    <button class="btn choice-btn" data-choice="1">一號洞</button>
    <button class="btn choice-btn" data-choice="2">二號洞</button>
    <button class="btn choice-btn" data-choice="3">三號洞</button>
  </div>
</div>

<!-- 頁面一失敗:螞蟻洞 -->
<div class="screen" id="page1-ants">
  <h2>灌了半天,什麼都沒有…</h2>
  <p>洞口有螞蟻爬進爬出,代表這裡已經被螞蟻佔據啦,蟋蟀早就搬家嘍!</p>
  <button class="btn btn-main" onclick="showScreen('page1')">重新選一個洞</button>
</div>

<!-- 頁面一失敗:蜘蛛網 -->
<div class="screen" id="page1-spider">
  <h2>啊!怎麼是牠!</h2>
  <div class="image-frame" style="background-image:url('spider01.jpeg')"></div>
  <p>洞口結著蜘蛛網,代表這個洞早就沒有蟋蟀出入,已經被蜘蛛佔用嘍!</p>
  <button class="btn btn-main" onclick="showScreen('page1')">重新選一個洞</button>
</div>

<!-- 頁面二:灌水技巧說明 -->
<div class="screen" id="page2">
  <h2>灌水技巧說明</h2>
  <div class="two-col">
    <div class="image-frame" style="background-image:url('pic02.jpeg')"></div>
    <div class="text-col">
      <p>準備一瓶裝滿水的寶特瓶。</p>
      <p>按住倒水,注意右側水位計,保持在<strong>綠色範圍</strong>!</p>
    </div>
  </div>
  <button class="btn btn-main" onclick="showScreen('page3')">準備好了,開始灌水!</button>
</div>

<!-- 頁面三:控水小遊戲 -->
<div class="screen" id="page3">
  <h2>💧 將水維持在滿水線!</h2>
  <div class="game-row">
    <div class="image-frame" style="background-image:url('pic03.jpeg')"></div>
    <div class="game-panel">
      <div id="status-msg">按住下方按鈕開始倒水</div>
      <div class="game-area">
        <div class="water-column">
          <svg class="bottle-svg" viewBox="0 0 90 200" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <clipPath id="bottleClip">
                <path d="M34,12 L34,34 C34,44 12,46 12,62 L12,168 Q12,182 26,182 L64,182 Q78,182 78,168 L78,62 C78,46 56,44 56,34 L56,12 Z"/>
              </clipPath>
            </defs>
            <rect id="water-fill-rect" x="0" width="90" y="182" height="0" fill="#4fc3f7" clip-path="url(#bottleClip)"/>
            <path d="M34,12 L34,34 C34,44 12,46 12,62 L12,168 Q12,182 26,182 L64,182 Q78,182 78,168 L78,62 C78,46 56,44 56,34 L56,12 Z" fill="none" stroke="#555" stroke-width="3"/>
            <rect x="30" y="0" width="30" height="12" rx="3" fill="#8d5b4c"/>
          </svg>
          <div class="bar-label">水壺水量</div>
        </div>
        <div class="hole-column">
          <div class="ground-strip"></div>
          <div class="soil-fill">
            <svg class="hole-svg" viewBox="0 0 100 220" xmlns="http://www.w3.org/2000/svg">
              <defs>
                <clipPath id="holeClip">
                  <path d="M15,0 L15,190 Q15,210 50,210 Q85,210 85,190 L85,0 Z"/>
                </clipPath>
              </defs>
              <!-- 洞穴內部底色(尚未灌到的部分) -->
              <path d="M15,0 L15,190 Q15,210 50,210 Q85,210 85,190 L85,0 Z" fill="#eeeeee"/>
              <!-- 水位(依百分比從底部往上填,裁切成洞穴形狀) -->
              <rect id="hole-fill-rect" x="10" width="80" y="210" height="0" fill="#0288d1" clip-path="url(#holeClip)"/>
              <!-- 滿水位標示區 -->
              <rect x="15" y="10.5" width="70" height="42" fill="#4caf50" opacity="0.25"/>
              <line x1="15" y1="10.5" x2="85" y2="10.5" stroke="#2e7d32" stroke-width="2" stroke-dasharray="4,3"/>
              <line x1="15" y1="52.5" x2="85" y2="52.5" stroke="#2e7d32" stroke-width="2" stroke-dasharray="4,3"/>
              <text x="50" y="35" text-anchor="middle" font-size="13" font-weight="bold" fill="#1b5e20">滿水位</text>
              <!-- 洞穴外框:頂部開放,底部圓弧收合 -->
              <path d="M15,0 L15,190 Q15,210 50,210 Q85,210 85,190 L85,0" fill="none" stroke="#1a1a1a" stroke-width="7" stroke-linecap="round"/>
            </svg>
            <div class="bar-label hole-label">地洞水量</div>
          </div>
        </div>
      </div>
      <button class="btn btn-main" id="pourBtn">按住倒水</button>
    </div>
  </div>
</div>

<!-- 頁面四:懸疑過場 -->
<div class="screen" id="page4">
  <div class="image-frame" style="background-image:url('pic04.jpeg')"></div>
  <p class="suspense-text">洞裡有東西要出來了…</p>
</div>

<!-- 頁面五:衝出洞口 -->
<div class="screen" id="page5">
  <div class="image-frame" style="background-image:url('pic05.jpeg')"></div>
  <h2>成功抓到!</h2>
  <button class="btn btn-main" onclick="showScreen('page6')">檢視抓到的蟋蟀</button>
</div>

<!-- 頁面六:鳴蟲圖鑑卡 -->
<div class="screen" id="page6">
  <div class="card-inner">
    <div class="photo-frame" id="photoFrame"></div>
    <p class="species-name" id="speciesName">-</p>
    <p class="nickname" id="nickname">-</p>
    <div class="stat-row">
      <div class="stat-box">
        <div class="stat-label">體長</div>
        <div class="stat-value" id="bodyLength">-- mm</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">戰鬥力</div>
        <div class="stat-value" id="powerValue">----</div>
      </div>
    </div>
    <div class="star-row" id="starRow">☆☆☆☆☆</div>
    <div class="desc-box" id="descBox">-</div>
    <div class="btn-row">
      <button class="btn btn-sound" id="soundBtn">🔊 聽聽鳴聲</button>
      <button class="btn btn-main" id="retryBtn">🔄 再灌一次</button>
    </div>
    <div class="sound-credit">聲音來源:夜間動物聲音資訊網(CC授權)・圖・文・聲音／許育銜</div>
  </div>
</div>

<script>
  // ========= 背景音樂 =========
  const bgmAudio = document.getElementById('bgmAudio');
  const bgmToggle = document.getElementById('bgmToggle');
  bgmAudio.volume = 0.19; // 在原本 0.25 的基礎上再調低 1/4
  let bgmMuted = false;

  // 瀏覽器規定要有使用者互動後才能自動播放,所以綁在第一次點擊畫面任何地方
  function startBgmOnce() {
    if (!bgmMuted) {
      bgmAudio.play().catch(() => {}); // 找不到 bgm.mp3 時安靜失敗,不影響遊戲
    }
    document.removeEventListener('click', startBgmOnce);
    document.removeEventListener('touchstart', startBgmOnce);
  }
  document.addEventListener('click', startBgmOnce);
  document.addEventListener('touchstart', startBgmOnce);

  bgmToggle.addEventListener('click', () => {
    bgmMuted = !bgmMuted;
    if (bgmMuted) {
      bgmAudio.pause();
      bgmToggle.innerText = '🔇';
    } else {
      bgmAudio.play().catch(() => {});
      bgmToggle.innerText = '🔊';
    }
  });

  // ========= 共用:切換畫面 =========
  function showScreen(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    if (id === 'page3') resetGame();
    if (id === 'page4') startSuspense();
    if (id === 'page6') generateCard();
  }

  // ========= 頁面一:洞口選擇 =========
  document.querySelectorAll('.choice-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const choice = btn.dataset.choice;
      if (choice === '1') showScreen('page2');
      else if (choice === '2') showScreen('page1-spider');
      else showScreen('page1-ants');
    });
  });

  // ========= 頁面三:控水遊戲 =========
  let waterLeft = 100;
  let holeWater = 0;
  let isPouring = false;
  let holdTime = 0;
  let gameOver = false;
  const targetTime = 4.0;

  const waterFillRect = document.getElementById('water-fill-rect');
  const holeFillRect = document.getElementById('hole-fill-rect');
  const statusMsg = document.getElementById('status-msg');
  const pourBtn = document.getElementById('pourBtn');

  // 寶特瓶 SVG 座標:瓶身可裝水範圍是 y=12(瓶頸頂端)到 y=182(瓶底)
  const BOTTLE_TOP = 12;
  const BOTTLE_BOTTOM = 182;
  function updateWaterFillDisplay(percent) {
    const totalHeight = BOTTLE_BOTTOM - BOTTLE_TOP;
    const filledHeight = totalHeight * (percent / 100);
    waterFillRect.setAttribute('y', BOTTLE_BOTTOM - filledHeight);
    waterFillRect.setAttribute('height', filledHeight);
  }

  // 洞口 SVG 座標:洞穴內部範圍是 y=0(頂端開放)到 y=210(圓弧洞底)
  const HOLE_TOP = 0;
  const HOLE_BOTTOM = 210;
  function updateHoleFillDisplay(percent) {
    const totalHeight = HOLE_BOTTOM - HOLE_TOP;
    const filledHeight = totalHeight * (percent / 100);
    holeFillRect.setAttribute('y', HOLE_BOTTOM - filledHeight);
    holeFillRect.setAttribute('height', filledHeight);
  }

  pourBtn.addEventListener('mousedown', startPouring);
  pourBtn.addEventListener('mouseup', stopPouring);
  pourBtn.addEventListener('mouseleave', stopPouring);
  pourBtn.addEventListener('touchstart', (e) => { e.preventDefault(); startPouring(); });
  pourBtn.addEventListener('touchend', stopPouring);
  pourBtn.addEventListener('touchcancel', stopPouring);

  function startPouring() {
    if (gameOver) { resetGame(); return; }
    isPouring = true;
  }
  function stopPouring() { isPouring = false; }

  function resetGame() {
    waterLeft = 100;
    holeWater = 0;
    holdTime = 0;
    isPouring = false;
    gameOver = false;
    pourBtn.disabled = false;
    pourBtn.innerText = "按住倒水";
    statusMsg.innerText = "按住下方按鈕開始倒水";
    statusMsg.style.color = "#d84315";
    waterFillRect && updateWaterFillDisplay(100);
    updateHoleFillDisplay(0);
  }

  setInterval(() => {
    if (gameOver) return;
    if (isPouring && waterLeft > 0) {
      waterLeft -= 2.0;
      holeWater += 3.2;
    } else {
      holeWater -= 1.8;
    }
    waterLeft = Math.max(0, waterLeft);
    holeWater = Math.min(100, Math.max(0, holeWater));
    updateWaterFillDisplay(waterLeft);
    updateHoleFillDisplay(holeWater);

    if (holeWater >= 75 && holeWater <= 95) {
      holdTime += 0.1;
      let remaining = Math.max(0, (targetTime - holdTime)).toFixed(1);
      statusMsg.innerText = `保持滿水!氣泡冒出中... (${remaining}s)`;
      statusMsg.style.color = "#2e7d32";
      if (holdTime >= targetTime) {
        gameOver = true;
        isPouring = false;
        pourBtn.disabled = true;
        pourBtn.innerText = "成功!";
        statusMsg.innerText = "🎉 成功!氣泡跑出來了,蟋蟀要衝出洞口了!";
        setTimeout(() => showScreen('page4'), 1200);
      }
    } else {
      holdTime = Math.max(0, holdTime - 0.05);
      if (holeWater > 95) {
        statusMsg.innerText = "⚠️ 水淹過頭溢出洞口啦!稍微鬆開!";
        statusMsg.style.color = "#c62828";
      } else {
        statusMsg.innerText = "⚠️ 水位太低!快補充水量!";
        statusMsg.style.color = "#d84315";
      }
    }

    if (waterLeft <= 0 && holdTime < targetTime) {
      gameOver = true;
      isPouring = false;
      pourBtn.innerText = "重新裝水";
      statusMsg.innerText = "❌ 寶特瓶沒水了!洞裡空氣還沒用完...";
      statusMsg.style.color = "#37474f";
    }
  }, 100);

  // ========= 頁面四:懸疑倒數 =========
  function startSuspense() {
    setTimeout(() => showScreen('page5'), 2000);
  }

  // ========= 頁面六:鳴蟲圖鑑卡 =========
  const SPECIES = {
    taiwan: {
      name: "台灣大蟋蟀",
      nickname: "土伯仔・塗猴",
      image: "pic061.jpeg",
      lengthMin: 32, lengthMax: 45,
      powerMultiplier: 30, powerRandomMax: 100,
      desc: "台灣體型最大的蟋蟀,常棲息在田埂或草地的地洞中,叫聲低沉宏亮。",
      sound: "Brachytrupes_portentosus.wav"
    },
    yellow: {
      name: "黃斑蟋蟀",
      nickname: "黑龍仔",
      image: "pic062.jpeg",
      lengthMin: 21, lengthMax: 30,
      powerMultiplier: 25, powerRandomMax: 50,
      desc: "體型較小但動作敏捷,全身黑亮帶黃斑是牠的招牌特徵,是鄉間常見的鳴蟲。",
      sound: "Gryllus_bimaculatus.wav"
    }
  };

  let currentCardData = null;

  function calcStars(power, data) {
    const minPower = data.lengthMin * data.powerMultiplier;
    const maxPower = data.lengthMax * data.powerMultiplier + data.powerRandomMax;
    const ratio = (power - minPower) / (maxPower - minPower);
    const stars = Math.min(5, Math.max(1, Math.ceil(ratio * 5)));
    return stars;
  }

  function generateCard() {
    if (cricketAudio) { cricketAudio.pause(); cricketAudio.currentTime = 0; }
    const speciesKey = Math.random() < 0.5 ? "taiwan" : "yellow";
    const data = SPECIES[speciesKey];
    const bodyLength = Math.floor(Math.random() * (data.lengthMax - data.lengthMin + 1)) + data.lengthMin;
    const power = Math.round(bodyLength * data.powerMultiplier + Math.random() * data.powerRandomMax);
    currentCardData = data;

    const stars = calcStars(power, data);
    document.getElementById('starRow').innerText = "★".repeat(stars) + "☆".repeat(5 - stars);

    document.getElementById('speciesName').innerText = data.name;
    document.getElementById('nickname').innerText = data.nickname;
    document.getElementById('bodyLength').innerText = bodyLength + " mm";
    document.getElementById('powerValue').innerText = power;
    document.getElementById('descBox').innerText = data.desc;

    const photoFrame = document.getElementById('photoFrame');
    photoFrame.style.backgroundImage = 'none';
    const img = new Image();
    img.onload = () => { photoFrame.style.backgroundImage = `url('${data.image}')`; };
    img.onerror = () => { photoFrame.style.backgroundColor = '#e6ccb2'; };
    img.src = data.image;
  }

  let cricketAudio = null;

  document.getElementById('soundBtn').addEventListener('click', () => {
    if (currentCardData && currentCardData.sound) {
      if (cricketAudio) { cricketAudio.pause(); cricketAudio.currentTime = 0; }
      cricketAudio = new Audio(currentCardData.sound);
      cricketAudio.play();
    } else {
      alert(`(這裡之後會播放${currentCardData ? currentCardData.name : ''}的鳴叫聲)`);
    }
  });

  document.getElementById('retryBtn').addEventListener('click', () => {
    if (cricketAudio) { cricketAudio.pause(); cricketAudio.currentTime = 0; }
    showScreen('page1');
  });
</script>

</body>
</html>
